<div class="container">
  <h1>404</h1>

  <p><strong>Page not found :(</strong></p>
  <p>The requested page could not be found.</p>
</div>

<script>
  // GitHub Pages serves a project site only at its repo's exact case, and sends
  // every other spelling here. Send /ilox/... on to /iLOX/..., for the projects
  // listed in _data/projects.yml.
  (function () {
    var links = {{ site.data.projects | map: "link" | jsonify }};
    var parts = location.pathname.split("/");
    var first = (parts[1] || "").toLowerCase();
    if (!first) return;
    for (var i = 0; i < links.length; i++) {
      var link = links[i];
      if (typeof link !== "string" || link.charAt(0) !== "/") continue;
      var name = link.split("/")[1];
      if (name && name.toLowerCase() === first && name !== parts[1]) {
        parts[1] = name;
        location.replace(parts.join("/") + location.search + location.hash);
        return;
      }
    }
  })();

  // A project whose site moved off this domain (zotgo and wikisync to
  // heibench.com) has an absolute link in _data/projects.yml. Send its old
  // /<name>/... path there, keeping the rest of the path.
  (function () {
    var projects = {{ site.data.projects | jsonify }};
    var parts = location.pathname.split("/");
    var first = (parts[1] || "").toLowerCase();
    if (!first) return;
    for (var i = 0; i < projects.length; i++) {
      var p = projects[i];
      if (!p || typeof p.link !== "string" || p.link.indexOf("https://") !== 0) continue;
      if (String(p.name).toLowerCase() !== first) continue;
      var base = p.link.charAt(p.link.length - 1) === "/" ? p.link : p.link + "/";
      location.replace(base + parts.slice(2).join("/") + location.search + location.hash);
      return;
    }
  })();
</script>
