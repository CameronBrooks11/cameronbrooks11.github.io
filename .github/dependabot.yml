version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The github-pages gem pins the whole Jekyll toolchain GitHub Pages runs, so
  # a bump here is what keeps a local build honest against the deployed site.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      gems:
        patterns: ["*"]
